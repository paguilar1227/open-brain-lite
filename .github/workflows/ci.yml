name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npm test
      - run: npm run test:frontend
      - run: python3 -m py_compile backend/python/media.py
      - run: bash -n scripts/setup.sh scripts/install-plugin.sh plugin/scripts/mcp.sh
